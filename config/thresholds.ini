# Sequoia-X 业务阈值配置
# 修改后重新启动程序生效。
# 百分比统一使用小数表示，例如 0.15 表示 15%；金额单位如无特别说明均为人民币元。

[ma_volume]
# 均线放量策略参与计算所需的最少日K数量，单位：交易日
min_bars = 20
# 短期收盘均线窗口，单位：交易日
short_ma = 5
# 长期收盘均线及成交量均线窗口，单位：交易日
long_ma = 20
# 当日成交量相对长期平均成交量的最低倍数
volume_ratio = 1.5

[turtle_trade]
# 海龟突破策略参与计算所需的最少日K数量，单位：交易日
min_bars = 21
# 突破高点的历史回看窗口，且不包含当日，单位：交易日
breakout_days = 20
# 当日最低成交额，用于过滤流动性不足的股票，单位：元
min_turnover = 100000000

[high_tight_flag]
# 高旗形策略参与计算所需的最少日K数量，单位：交易日
min_bars = 40
# 判断前期强动量的价格区间窗口，单位：交易日
momentum_days = 40
# 判断近期高位收敛整理的价格区间窗口，单位：交易日
consolidation_days = 10
# 计算整理期平均成交量的窗口，单位：交易日
volume_days = 20
# 动量窗口内最高价与最低价的最小比值，1.6代表区间涨幅约60%
momentum_ratio = 1.6
# 整理窗口内最高价与最低价的最大比值，1.15代表区间振幅上限约15%
consolidation_ratio = 1.15
# 整理期最低价相对动量期最高价的最低比例，用于判断是否仍处于高位
high_level_ratio = 0.8
# 当日成交量相对历史平均成交量的最大比例，用于识别缩量
shrink_volume_ratio = 0.6

[limit_up_shakeout]
# 涨停洗盘策略参与计算所需的最少日K数量，单位：交易日
min_bars = 3
# 昨日收盘相对前日收盘的最低倍数，用于近似判断昨日是否涨停
limit_up_ratio = 1.095
# 今日成交量相对昨日成交量的最低倍数，用于判断是否放量
volume_ratio = 2.0

[uptrend_limit_down]
# 上升趋势跌停策略参与计算所需的最少日K数量，单位：交易日
min_bars = 60
# 判断中期趋势的短期均线窗口，单位：交易日
short_ma = 20
# 判断中期趋势的长期均线窗口，单位：交易日
long_ma = 60
# 今日收盘相对昨日收盘的最高倍数，用于近似判断是否跌停
limit_down_ratio = 0.905
# 今日成交量相对短期平均成交量的最低倍数，用于判断是否放量
volume_ratio = 2.0

[rps_breakout]
# 计算相对强度涨幅和滚动高点的历史窗口，单位：交易日
period = 120
# RPS横截面百分位最低分数，90表示进入全市场前10%
rps_threshold = 90
# 计算滚动高点时允许的最少有效样本占完整窗口的比例
min_period_ratio = 0.5
# 最新收盘价相对滚动最高价的最低比例，用于判断是否接近突破
breakout_ratio = 0.90

[private_placement]
# 定向增发公告向前回看的自然日数量
lookback_days = 7

[low_price_multi_factor]
# 低价多因子策略参与计算所需的最少日K数量，单位：交易日
min_bars = 252
# 原始低价多因子策略最终输出和推送的股票数量上限
max_holdings = 3
# 原始候选、组合专用候选和持仓建议保留的排名数量上限
ranking_limit = 10
# 候选股票允许的最新收盘价上限，单位：元
max_close = 30
# 最近成交额均值的最低要求，单位：元
min_turnover_ma20 = 80000000
# 计算12-1动量时跳过的最近交易日数量，用于降低短期反转影响
momentum_skip_days = 21
# 计算长期动量时向前回看的交易日数量
momentum_lookback_days = 252
# 计算历史波动率的滚动窗口，单位：交易日
volatility_days = 60
# 计算趋势强度所使用的收盘均线窗口，单位：交易日
trend_ma_days = 120
# 计算平均成交额和流动性因子的窗口，单位：交易日
turnover_days = 20
# 原始综合排名中长期动量因子的权重
weight_momentum = 0.35
# 原始综合排名中低波动因子的权重，波动越低得分越高
weight_low_volatility = 0.20
# 原始综合排名中价格相对趋势均线强度的权重
weight_trend = 0.15
# 原始综合排名中平均成交额流动性因子的权重
weight_liquidity = 0.10
# 原始综合排名中ROE财务质量因子的权重
weight_roe = 0.10
# 原始综合排名中营业收入同比增长因子的权重
weight_revenue_yoy = 0.05
# 原始综合排名中净利润同比增长因子的权重
weight_profit_yoy = 0.05
# 原始综合排名中经营现金流相对EPS质量因子的权重
weight_cashflow = 0.05
# 原始综合排名中动态市盈率因子的权重，估值越低得分越高
weight_pe = 0.05
# 原始综合排名中市净率因子的权重，估值越低得分越高
weight_pb = 0.05
# 原始综合排名中毛利率因子的权重
weight_gross_margin = 0.05
# 组合层专用排名中低波动因子的权重，不重复计算动量和趋势
combo_weight_low_volatility = 0.35
# 组合层专用排名中平均成交额流动性因子的权重
combo_weight_liquidity = 0.15
# 组合层专用排名中ROE财务质量因子的权重
combo_weight_roe = 0.15
# 组合层专用排名中营业收入同比增长因子的权重
combo_weight_revenue_yoy = 0.05
# 组合层专用排名中净利润同比增长因子的权重
combo_weight_profit_yoy = 0.10
# 组合层专用排名中经营现金流相对EPS质量因子的权重
combo_weight_cashflow = 0.10
# 组合层专用排名中动态市盈率因子的权重，估值越低得分越高
combo_weight_pe = 0.05
# 组合层专用排名中市净率因子的权重，估值越低得分越高
combo_weight_pb = 0.05
# 组合层专用排名中毛利率因子的权重
combo_weight_gross_margin = 0.05

[comprehensive_trend]
# 综合趋势策略参与评估所需的最少日K数量，单位：交易日
min_history = 130
# 每只股票参与综合趋势计算时最多保留的最近日K数量
history_limit = 260
# 综合趋势正式选股结果的最大股票数量
max_candidates = 30
# 全市场站上MA20的股票比例门槛，用于市场宽度加分
market_breadth_threshold = 0.55
# 市场环境被判定为强势所需的最低市场分数
market_strong_score = 15
# A类平台放量突破买点所需的最低综合评分
entry_score_a = 75
# B类突破后缩量回踩买点所需的最低综合评分
entry_score_b = 65
# C类上升趋势恢复买点所需的最低综合评分
entry_score_c = 65
# 综合趋势策略进入最终正式选股列表所需的最低评分
selection_score = 65
# 净利润同比增长允许的最低值，单位：百分数；-50表示同比下降50%
financial_profit_yoy_floor = -50
# ROE允许的最低值，低于该值将触发财务风险扣分
financial_roe_floor = 0
# 收盘价高于MA20的最大安全偏离比例，超过后触发过热风险
deviation_risk = 0.15
# 高量长上影风险中，当日成交量相对20日均量的最低倍数
high_volume_ratio = 1.8
# 高量长上影风险中，上影线占当日振幅的最低比例
upper_shadow_ratio = 0.4
# 平台突破时当日成交量相对20日均量的最低倍数
breakout_volume_ratio = 1.5
# 平台突破时上影线占当日振幅允许的最大比例
breakout_upper_shadow_ratio = 0.35
# 缩量回踩时最低价相对MA10或MA20允许的最大上浮倍数
pullback_price_buffer = 1.02
# 缩量回踩时当日成交量相对20日均量允许的最大比例
pullback_volume_ratio = 0.8
# 跌破MA60清仓信号中，当日成交量相对20日均量的最低倍数
exit_volume_ratio = 1.2
# 判断短线严重过热的RSI下限
overheat_rsi = 85
# 计算结构止损价时MA20所乘的保护比例
stop_ma_ratio = 0.98
# 计算ATR止损价时使用的ATR倍数
atr_stop_multiple = 2.0
# 判断上升趋势或主升浪时RSI的最低要求
uptrend_rsi = 55
# 判断底部吸筹候选时，收盘价相对60日高点的最大回撤比例
accumulation_drawdown = -0.15
# 判断底部吸筹候选时，40日最高价与最低价区间振幅上限
accumulation_range = 0.25
# 判断底部吸筹候选时，MA20在最近数日允许的最大变化比例
accumulation_ma_slope = 0.02
# 判断底部吸筹候选时，上涨日均量相对下跌日均量的最低比例
accumulation_volume_balance = 0.8
# 判断洗盘候选时RSI允许的最低值
wash_rsi_floor = 40
# 判断主力撤离候选时，收盘价相对60日最高价的最低比例
distribution_high_zone = 0.85
# 判断主力撤离候选时，当前OBV相对近期最高OBV的上限比例
distribution_obv_ratio = 0.98

[strategy_combiner]
# 趋势动量策略组命中时贡献的组合信号分数
weight_trend_momentum = 15
# 形态整理策略组命中时贡献的组合信号分数
weight_pattern = 10
# 反转机会策略组命中时贡献的组合信号分数
weight_reversal = 5
# 事件驱动策略组命中时贡献的组合信号分数
weight_event = 5
# 横截面因子组无详细排名时使用的默认组合信号分数
weight_cross_section = 10
# 命中足够多不同策略组时额外增加的跨组共振分数
cross_family_bonus = 10
# 构成跨策略组共振所需的最少不同策略组数量
cross_family_min_count = 2
# 多策略组候选通过综合趋势风险过滤所需的最低趋势评分
risk_pass_score = 50
# 综合趋势明确买点被视为趋势确认所需的最低趋势评分
trend_confirm_score = 65
# 综合趋势评分计入最终组合评分时使用的乘数
trend_score_weight = 0.5
# 最终组合评分允许的最大值
max_combined_score = 100
# 低价多因子组合专用排名第1名贡献的分数
factor_rank_1 = 10
# 低价多因子组合专用排名第2名贡献的分数
factor_rank_2 = 9
# 低价多因子组合专用排名第3名贡献的分数
factor_rank_3 = 8
# 低价多因子组合专用排名第4至第5名贡献的分数
factor_rank_4_5 = 6
# 低价多因子组合专用排名第6至第10名贡献的分数
factor_rank_6_10 = 3

[intraday_monitor]
# 综合趋势快照进入盘中重点评估范围所需的最低评分
snapshot_score = 65
# 实时价相对持仓成本的最大允许亏损比例，达到后触发持仓亏损预警
holding_stop_loss = -0.08
# 放量下跌预警中，预计全天成交量相对20日均量的最低倍数
sell_volume_ratio = 1.8
# 放量下跌预警中，实时涨跌幅允许的最高值；-0.03表示下跌至少3%
sell_change_pct = -0.03
# 盘中突破候选所需的最低综合趋势评分
breakout_score = 65
# 盘中价格相对当日最高价的最低比例，用于判断是否贴近最高价
breakout_price_to_high = 0.995
# 盘中突破候选预计全天成交量相对20日均量的最低倍数
breakout_volume_ratio = 1.5
# 普通策略或自选股触发盘中走强所需的最低涨幅
strong_change_pct = 0.02
# 普通策略或自选股触发盘中走强所需的最低预计全天量比
strong_volume_ratio = 1.3
# 尾盘买点确认开始生效的小时，使用24小时制
tail_hour = 14
# 尾盘买点确认开始生效的分钟
tail_minute = 45

[portfolio_advisor]
# 持仓操作建议读取的低价多因子候选数量上限
candidate_limit = 10
# 被标记为重点候选并可用于持仓替换的最大排名
focus_rank_limit = 3
# 生成持仓或自选操作建议所需的最少日K数量，单位：交易日
min_history = 60
# 持仓收益率达到该亏损比例且趋势走弱时触发止损建议
stop_loss = -0.08
# 持仓收益率达到该盈利比例后开始评估止盈条件
take_profit = 0.15
# 盈利持仓触发分批止盈建议所需的最低RSI
take_profit_rsi = 72
# 自选股被判断为趋势健康时允许的最低RSI
watch_rsi_min = 45
# 自选股被判断为趋势健康时允许的最高RSI
watch_rsi_max = 70
# 自选股被判断为超卖观察机会时的RSI上限
oversold_rsi = 30
# 自选股趋势健康判断中，当日成交量相对20日均量的最低倍数
min_volume_ratio = 1.0

[paper_trading]
# 统一模拟组合首次建仓和后续加仓占组合初始本金的比例
initial_buy_ratio = 0.05
add_buy_ratio = 0.03
# 每只股票完整持仓周期允许的最大加仓次数
max_add_count = 1
# 单只股票和整个组合允许使用的最高资金比例
max_position_ratio = 0.10
max_exposure_ratio = 0.80
# 组合同时持有的股票数量上限
max_positions = 10
# 单日最多新开仓数量
max_daily_new_positions = 3
# 单笔允许承担的组合本金风险和组合全部持仓风险上限
risk_per_trade_ratio = 0.008
max_portfolio_heat_ratio = 0.06
# 市场强势、中性、弱势时的总仓位上限
strong_market_exposure_ratio = 0.80
neutral_market_exposure_ratio = 0.60
weak_market_exposure_ratio = 0.30
# 单一策略组和行业的持仓市值上限
max_strategy_family_ratio = 0.35
max_industry_ratio = 0.25
# 模拟账户收到放量下跌信号时计划卖出的当前持股比例
sell_ratio = 0.50
# A股模拟买卖的最小交易单位，单位：股
lot_size = 100
# 模拟成交滑点、佣金、最低佣金及卖出印花税
slippage_rate = 0.001
commission_rate = 0.0003
minimum_commission = 5
stamp_duty_rate = 0.0005
# 是否允许仅来自普通单策略或自选股的C级候选自动建仓
allow_tier_c_buy = false
# 盈利达到该比例后启动移动止盈；从最高价回撤达到阈值时退出
trailing_start_profit = 0.08
trailing_drawdown = 0.06
# 跌破MA20减仓的比例；跌破MA60清仓
ma20_reduce_ratio = 0.50
# 持仓超过指定交易日且收益未达最低值时执行时间止损
max_holding_days = 15
time_stop_min_return = 0.02

[prediction]
# 自动跟踪预测的目标交易日周期，使用英文逗号分隔
tracking_horizons = 1,3,5,7,10
# 概率预测允许的最短预测周期，单位：交易日
min_horizon = 1
# 概率预测允许的最长预测周期，单位：交易日
max_horizon = 60
# 命令行未指定预测周期时使用的默认交易日数量
default_horizon = 5
# 执行时间外验证所需的最少有效历史交易日数量
min_validation_days = 80
# 全部有效日期中用于训练和校准的比例，其余作为时间外验证集
train_ratio = 0.80
# 训练日期中用于基础模型训练的比例，其余作为概率校准集
calibration_ratio = 0.85
# 判断预测方向为上涨的最低概率
direction_probability = 0.50
# 被视为高置信度下跌预测的最高上涨概率
confidence_low = 0.40
# 被视为高置信度上涨预测的最低上涨概率
confidence_high = 0.60

[feishu]
# 组合决策详细卡片允许的最大序列化字符数，超过后自动拆分为多条消息
combined_detail_max_chars = 12000
